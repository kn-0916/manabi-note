# Supabaseは1週間まったく使われないと一時停止するので、毎日1回データベースに問い合わせて起こしておく
name: keepalive
on:
  schedule:
    - cron: '17 3 * * *'   # 毎日 日本時間 12:17
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://lrnsdnydfqdchgnubfgo.supabase.co/rest/v1/achievements?select=id&limit=1" \
            -H "apikey: sb_publishable_2Y_Km6gU_w3P4LCR-v-cTg_D2ocTsuO")
          echo "HTTP $code"
          test "$code" -lt 500
