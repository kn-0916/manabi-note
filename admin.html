2. 運営者が本サービス上で随時掲載するお知らせ、ガイドライン等は、本規約の一部を構成するものとします。
## 第2条(アカウントの登録と管理)
1. 利用者は、Googleアカウントを用いて本サービスに登録するものとします。
2. 利用者は、ニックネーム、ユーザーID、生年月日その他の登録情報を、正確かつ最新の内容に保つものとします。
3. 利用者は、自己のアカウントおよびグループのルームコードを自己の責任で管理するものとし、これらを第三者に不正に利用させてはなりません。
## 第3条(個人情報の取扱い)
1. 運営者は、本サービスの提供にあたり取得した利用者の個人情報を、本サービスの運営に必要な範囲でのみ利用します。
2. 運営者は、法令に基づく場合を除き、利用者の同意を得ることなく、個人情報を外部の第三者に提供、開示または公開しません。
3. 利用者がグループ内で公開した情報(ニックネーム、ユーザーID、アイコン、肩書、勉強時間等)は、同一グループのメンバーに表示されます。利用者は、この点を理解したうえで本サービスを利用するものとします。
## 第4条(通信料)
本サービスの利用に際して発生する通信料(Wi-Fi、モバイルデータ通信その他の通信サービスの利用に係る料金を含みますが、これらに限りません。)およびその他の費用は、すべて利用者の負担とします。運営者は、これらの費用について、一切の責任を負いません。
## 第5条(免責事項)
1. 運営者は、本サービスの利用または利用不能により、利用者に学習成績、試験結果、進学その他の不利益が生じた場合であっても、一切の責任を負いません。
2. 運営者は、本サービスの内容、機能、正確性、完全性、有用性および継続性について、いかなる保証もしません。
3. 運営者は、システム障害、通信障害、端末の故障その他の事由により、利用者が登録したデータ(単語帳、教材、予定、勉強時間の記録等)が消失または破損した場合であっても、一切の責任を負いません。
4. 利用者間またはグループ内で生じたトラブルについて、運営者は一切の責任を負いません。当事者間で解決するものとします。
## 第6条(禁止事項)
利用者は、本サービスの利用にあたり、次の行為をしてはなりません。
(1) 法令または公序良俗に違反する行為
(2) 他の利用者その他の第三者を誹謗中傷し、または不利益を与える行為
(3) 他人になりすまし、または虚偽の情報を登録する行為
(4) 他の利用者の個人情報を、本人の同意なく収集、公開または利用する行為
(5) 第三者の著作権その他の権利を侵害する教材等を、アップロードまたは共有する行為
(6) 本サービスの運営を妨害し、またはそのおそれのある行為(不正アクセス、過度な負荷をかける行為等を含みます。)
(7) その他、運営者が不適切と判断する行為
## 第7条(違反時の措置)
1. 運営者は、利用者が本規約に違反した、またはそのおそれがあると判断した場合、当該利用者に対して警告を行うことができます。
2. 利用者が本規約に複数回違反した場合、運営者は、事前の通知なく、当該利用者のアカウントを永久に利用停止(永久BAN)とすることができます。
3. 前項の措置により利用者に生じた損害について、運営者は一切の責任を負いません。
## 第8条(本規約の変更)
運営者は、必要と判断した場合、本規約を変更できるものとします。変更後の規約は、本サービス上に掲載した時点から効力を生じ、変更後に本サービスを利用した場合は、変更後の規約に同意したものとみなします。
## 第9条(準拠法)
本規約の解釈および適用は、日本法に準拠するものとします。
