<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
.coinbar{display:flex;align-items:center;justify-content:center;gap:12px;padding:26px 16px;border:1px solid var(--line);border-radius:20px;background:var(--soft);margin-top:14px}

.coinbar .cn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#F5B700;color:#fff}
.gbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.gb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 10px;font-size:20px;font-weight:700}
.gb small{font-size:12px;font-weight:500;opacity:.85}
.gb.low{opacity:.45}
.rkrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.rk{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--rc);font-size:13px}
.rk b{color:var(--rc)}
.zk{margin-top:20px}
.zk-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.zk-h b{color:var(--rc);font-size:20px;font-family:var(--font-display)}
.zk-h .grow{flex:1}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.zc{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;aspect-ratio:1;padding:8px;border:2px solid var(--rc);border-radius:16px;background:var(--surface);text-align:center;min-width:0;overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
button.zc:active{transform:scale(.96)}
.zc.lock{border-style:dashed;border-color:var(--line);background:var(--soft);color:var(--muted);font-size:22px}
.zc.cur{box-shadow:0 0 0 3px color-mix(in srgb,var(--rc) 28%,transparent)}
.zc .pi{width:100%;flex:1;min-height:0;display:grid;place-items:center}
.zc .pi img,.pet-i img,.pet-peek img,.gc-i img{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none}
.zc .zn{font-size:11px;line-height:1.2;overflow-wrap:anywhere}
.zc .zx{position:absolute;top:4px;right:6px;font-size:11px;color:var(--muted)}
.zc .zm{position:absolute;top:4px;left:4px;color:var(--rc)}
.zc.tz span{font-size:13px;font-weight:700;overflow-wrap:anywhere}
.pfb{display:grid;place-items:center;width:100%;height:100%;max-width:64px;max-height:64px;aspect-ratio:1;border-radius:50%;color:#fff;font-weight:700;font-size:22px}
.petlayer{position:fixed;left:0;right:0;top:0;bottom:0;pointer-events:none;z-index:0;overflow:hidden}
main{position:relative;z-index:1}
.hdr{position:relative;z-index:2}
.rkb{font-size:11px;font-weight:700;margin-left:6px}
.pet-w{position:absolute;left:0;top:0;width:60px;height:60px;will-change:transform}
.pet-i{width:100%;height:100%;animation:petbob .45s ease-in-out infinite alternate}
@keyframes petbob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.pet-peek{position:absolute;bottom:0;width:84px;height:84px;transform:translateY(108%);animation:petpeek 13s ease-in-out infinite;pointer-events:none;z-index:1}
@keyframes petpeek{0%,58%{transform:translateY(108%)}66%,82%{transform:translateY(6%)}90%,100%{transform:translateY(108%)}}
@media (prefers-reduced-motion:reduce){.pet-i,.pet-peek{animation:none}.pet-peek{transform:translateY(20%)}}
.gres{position:fixed;inset:0;z-index:70;background:rgba(255,255,255,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px;opacity:0;transition:opacity .3s var(--ease);overflow:auto}
.gres.in{opacity:1}
.gcards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:min(640px,100%)}
.gcards.one{grid-template-columns:minmax(0,200px)}
@media (max-width:520px){.gcards:not(.one){grid-template-columns:repeat(3,minmax(0,1fr))}}
.gc{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px 6px;border:2px solid var(--rc);border-radius:16px;background:var(--surface);text-align:center;opacity:0}
.gc.top{box-shadow:0 0 0 3px color-mix(in srgb,var(--rc) 30%,transparent),0 0 26px color-mix(in srgb,var(--rc) 55%,transparent)}
.gc-i{width:100%;aspect-ratio:1;display:grid;place-items:center}
.gc-t{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.gc-n{font-size:12px;line-height:1.2;overflow-wrap:anywhere}
.gc-r{font-size:12px;font-weight:700;color:var(--rc)}
.gc-new{position:absolute;top:-8px;left:-6px;background:var(--bad);color:#fff;font-style:normal;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px}
@keyframes gcin{from{opacity:0;transform:translateY(16px) scale(.86) rotateY(80deg)}to{opacity:1;transform:none}}
.gres-b{display:flex;gap:12px}
@media (prefers-reduced-motion:reduce){.gres .gc{animation:none!important;opacity:1}}

@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.gres.play .gc{animation:gcin .55s var(--ease) forwards}
.gres.intro .gcards,.gres.intro .gres-b{visibility:hidden}
.gres-b{opacity:0;transition:opacity .4s .5s}.gres.play .gres-b{opacity:1}
.gc.top::after{content:'';position:absolute;inset:0;border-radius:14px;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.85) 50%,transparent 62%);transform:translateX(-130%);clip-path:inset(0 round 14px);animation:gshine 3s 1.1s ease-in-out infinite;pointer-events:none}
@keyframes gshine{0%{transform:translateX(-130%)}35%,100%{transform:translateX(130%)}}
.gc.t2{--ang:0deg;border-color:transparent;background:linear-gradient(#fff,#fff) padding-box,conic-gradient(from var(--ang),#ff5f6d,#ffc371,#47e891,#4ac7ff,#c06cff,#ff5f6d) border-box;animation-name:gcin,gspin;animation-duration:.55s,3s;animation-iteration-count:1,infinite;animation-timing-function:var(--ease),linear;animation-fill-mode:forwards,none}
@keyframes gspin{to{--ang:360deg}}
.gfx{position:absolute;inset:0;z-index:2;background:#0A0F20;display:grid;place-items:center;overflow:hidden;cursor:pointer;animation:gfxin .35s ease-out both}
.gres.t2 .gfx{background:#05060F}
.gres.out .gfx{animation:gfxout .45s ease-in forwards}
@keyframes gfxin{from{opacity:0}to{opacity:1}}
@keyframes gfxout{to{opacity:0}}
.gfx-rays{position:absolute;left:50%;top:50%;width:190vmax;height:190vmax;margin:-95vmax 0 0 -95vmax;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc) 55%,transparent) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 42%);mask:radial-gradient(circle,#000 0,transparent 42%);animation:graysp 9s linear infinite,graysc 1.4s ease-out both;opacity:.9}
.gres.t2 .gfx-rays{background:repeating-conic-gradient(from 0deg,#ff5f6d 0 6deg,transparent 6deg 12deg,#ffc371 12deg 18deg,transparent 18deg 24deg,#47e891 24deg 30deg,transparent 30deg 36deg,#4ac7ff 36deg 42deg,transparent 42deg 48deg,#c06cff 48deg 54deg,transparent 54deg 60deg)}
@keyframes graysp{to{transform:rotate(360deg)}}
@keyframes graysc{from{scale:.2;opacity:0}to{scale:1;opacity:.9}}
.gfx-orb{position:relative;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--rc) 55%,color-mix(in srgb,var(--rc) 40%,#000));box-shadow:0 0 50px 12px color-mix(in srgb,var(--rc) 70%,transparent);animation:gshk1 1.3s ease-in both}
.gres.t2 .gfx-orb{animation:gshk2 2.2s ease-in both,ghue 1.2s linear infinite}
@keyframes ghue{to{filter:hue-rotate(360deg)}}
@keyframes gshk1{0%{transform:scale(.4)}20%{transform:scale(1) rotate(-6deg)}35%{transform:rotate(7deg)}50%{transform:rotate(-9deg) scale(1.05)}65%{transform:rotate(11deg)}80%{transform:rotate(-13deg) scale(1.1)}100%{transform:rotate(0) scale(1.18)}}
@keyframes gshk2{0%{transform:scale(.4)}12%{transform:scale(1)}25%{transform:rotate(-8deg)}37%{transform:rotate(10deg) scale(1.05)}50%{transform:rotate(-13deg) scale(1.1)}62%{transform:rotate(15deg) scale(1.15)}75%{transform:rotate(-18deg) scale(1.22)}88%{transform:rotate(20deg) scale(1.3)}100%{transform:rotate(0) scale(1.4)}}
.gfx-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.gres.burst .gfx-flash{animation:gflash 1s ease-out forwards}
@keyframes gflash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.gres.burst .gfx-orb{animation:gburst .55s ease-in forwards}
@keyframes gburst{to{transform:scale(14);opacity:0}}
.gfx-rank{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;opacity:0;color:#fff;pointer-events:none}
.gfx-rank b{display:block;font-family:var(--font-display);font-size:min(30vw,150px);line-height:1;letter-spacing:.04em;text-shadow:0 0 28px var(--rc),0 0 60px var(--rc)}
.gfx-rank span{display:block;font-size:20px;letter-spacing:.2em;margin-top:6px;text-shadow:0 0 14px var(--rc)}
.gres.burst .gfx-rank{animation:grank 1.2s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes grank{0%{opacity:0;transform:translateY(-50%) scale(3);filter:blur(10px)}30%{opacity:1;transform:translateY(-50%) scale(1);filter:blur(0)}100%{opacity:1;transform:translateY(-50%) scale(1.06)}}
.gfx-p{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--c);opacity:0}
.gres.burst .gfx-p{animation:gpart 1.2s ease-out forwards}
@keyframes gpart{0%{opacity:1;transform:translate(0,0) scale(1.4)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
.gres.t2.burst .gfx{animation:gfxin .35s ease-out both,gshake .5s linear}
@keyframes gshake{0%,100%{translate:0 0}20%{translate:-8px 5px}40%{translate:7px -6px}60%{translate:-6px -4px}80%{translate:5px 6px}}

<style>/*HIGURE-START*/

<style>
/* Layout: 上部に固定ヘッダー(左=モード切替 / 中央=ロゴ / 右=メニュー)。その下に1画面ずつ表示するスマホ向けアプリ。
   プライベートは青、グループはオレンジで画面全体の差し色が切り替わる。 */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#F5F7FB; --ink:#1B2336; --muted:#6B7488; --line:#E7EBF2;
  --private:#2250D8; --group:#C9620A; --on-accent:#FFFFFF;
  --good:#17894F; --bad:#CC3D3D; --shadow:0 6px 22px rgba(27,35,54,.08);
  --ease:cubic-bezier(.22,.8,.24,1);
  --font-display:'Higure Gothic','Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  --font-body:'Higure Gothic','Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  --font-mono:'DM Mono',ui-monospace,Menlo,monospace;
}
@property --accent{syntax:'<color>';inherits:true;initial-value:#2250D8}
html{background:var(--bg)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;transition:--accent .45s var(--ease);
  --accent:var(--private);--accent-soft:color-mix(in srgb,var(--accent) 12%,var(--surface))}
body[data-mode="group"]{--accent:var(--group)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance}
.muted{color:var(--muted)} .small{font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ヘッダー */
.hdr{flex:none;height:56px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.modebtn{justify-self:start;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 10px;border-radius:999px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;white-space:nowrap}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px;font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.02em}
.mark{width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:16px}
.mark.big{width:72px;height:72px;border-radius:22px;font-size:40px}
.menubtn{position:relative;justify-self:end;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
main{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.view{width:100%;max-width:720px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.view.fill{height:100%}
.sub{display:flex;align-items:center;gap:8px}
.sub h2{flex:1;font-size:20px}
.iconbtn{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.iconbtn.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* ボタン・入力 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.in{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
textarea.in{min-height:96px;resize:vertical}
.in.bad{border-color:var(--bad)}
.msg{font-size:13px;min-height:20px}.msg.bad{color:var(--bad)}.msg.good{color:var(--good)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.item .t{font-weight:700;overflow-wrap:anywhere}
.rk-total{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:2px 4px}
.rk-total span{font-size:13px;color:var(--muted)}
.rk-total b{font-size:13px;font-weight:500;color:var(--muted)}
.rk-wrap{overflow-x:auto;padding:4px 0 8px;margin:0 -4px}
.rk{display:flex;align-items:flex-end;gap:14px;min-width:min-content;justify-content:center;padding:0 4px;min-height:260px}
.rk-col{display:flex;flex-direction:column;align-items:center;width:72px;flex:none;gap:6px}
.rk-crown{height:28px;display:flex;align-items:flex-end;justify-content:center}
.rk-crown .crown{margin:0;animation:rkcrown .7s var(--ease) both;animation-delay:.9s}
.rk-bar{width:44px;height:var(--h);border-radius:12px 12px 4px 4px;background:color-mix(in srgb,var(--accent) 22%,#fff);transform-origin:bottom;animation:rkgrow .8s var(--ease) both;animation-delay:calc(var(--i)*90ms)}
.rk-col.first .rk-bar{background:var(--accent)}
.rk-col.me .rk-name{font-weight:700}
.rk-name{font-size:13px;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.rk-time{font-size:12px;color:var(--muted);white-space:nowrap}
@keyframes rkgrow{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
@keyframes rkcrown{from{transform:translateY(-10px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.crown{color:#E3A008;vertical-align:-2px;margin-right:4px;flex:none}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:700}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}

/* ホーム */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:132px;padding:16px;text-align:left;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.tile .ico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tile b{font-family:var(--font-display);font-size:17px;display:block}
.tile .ico+span>span{font-size:12.5px;color:var(--muted)}
.tile b{color:var(--ink)}
.center{align-items:center;text-align:center;justify-content:center;min-height:100%}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:12px}
.hero h1{font-size:30px}
.code{font-family:var(--font-mono);font-size:30px;letter-spacing:.18em;font-weight:500}
.dots{display:flex;gap:6px}
.dots i{width:28px;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}

/* フラッシュカード */
.fc{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform;perspective:1200px;width:100%;aspect-ratio:3/2;max-height:48vh;cursor:pointer;outline-offset:4px}
.fc-in{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc.noanim .fc-in{transition:none}
.fc.dragging{cursor:grabbing}
.fc .face>*{opacity:calc(1 - var(--swo,0)*.9)}
.fc::after{content:attr(data-sw);position:absolute;inset:0;border-radius:20px;display:grid;place-items:center;font-family:var(--font-display);font-size:30px;font-weight:700;pointer-events:none;opacity:var(--swo,0);z-index:3}
.fc.sw-k::after{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.fc.sw-u::after{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-family:var(--font-display);font-size:clamp(24px,7vw,38px);font-weight:700;overflow:auto;overflow-wrap:anywhere;line-height:1.35}
.face.long{font-size:clamp(16px,4.4vw,22px)}
.face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.face small{position:absolute;top:12px;left:16px;font-family:var(--font-body);font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.clock{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.stctl{display:grid;grid-template-columns:48px 1fr 1fr 48px;gap:10px}

.btn.know{background:var(--good);border-color:var(--good);color:#fff}
.btn.still{color:var(--bad);border-color:var(--bad)}
.big-time{font-size:56px;font-weight:500;text-align:center;letter-spacing:.02em}

/* PDF */
.pdfbox{position:relative;touch-action:pan-x pan-y;overscroll-behavior:contain;flex:1;min-height:0;overflow:auto;background:color-mix(in srgb,var(--ink) 8%,var(--bg));border-radius:12px;border:1px solid var(--line);padding:8px;text-align:center}
#pdfInner{display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;min-width:100%}
.pgw{background:#fff;box-shadow:var(--shadow);flex:none;overflow:hidden}
.pgw canvas{display:block;width:100%;height:100%}
.seg.sm button{min-height:36px;padding:6px;font-size:14px}
.itembtn{display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit}

/* カレンダー */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1;border-radius:10px;border:1px solid transparent;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-variant-numeric:tabular-nums;padding:0}
.day.out{opacity:.35}
.day.today{border-color:var(--accent);font-weight:700}
.day.sel{background:var(--accent);color:var(--on-accent)}
.day i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day.sel i{background:var(--on-accent)}

/* 勉強時間 */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--muted)}
.bars b{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:3px}

/* マイページ(アイコン2/5・ニックネーム1/5・その他2/5) */
.mypage{min-height:100%;display:grid;grid-template-rows:2fr 1fr 2fr;padding:0 16px 16px;max-width:720px;margin:0 auto;width:100%}
.mp-icon{display:flex;align-items:center;justify-content:center;min-height:0;padding:12px 0}
.avatar{height:100%;max-height:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;background:var(--accent-soft);border:3px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-family:var(--font-display);font-weight:700;overflow:hidden}
.mp-nick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:0;text-align:center}
.mp-nick h1{font-size:clamp(26px,8vw,40px);overflow-wrap:anywhere;line-height:1.2}
.mp-rest{color:var(--muted);display:flex;flex-direction:column;gap:12px;font-size:14px;padding-top:4px;min-height:0}
.mp-rest h3{font-size:12px;letter-spacing:.06em;font-weight:700;margin-bottom:2px;color:var(--muted)}
.mp-rest button.tt{display:block;width:100%;text-align:left;background:none;border:0;padding:3px 0;color:var(--muted)}
.mp-rest .cur{color:var(--accent);font-weight:700}
.mp-rest .lock{opacity:.55}
.mp-rest .mplink{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:14px 0;color:var(--muted);font:inherit;font-size:14px;text-align:left}
.mpl-r{display:inline-flex;align-items:center;gap:4px}
.item.blank{min-height:56px;background:var(--soft);border-style:dashed;box-shadow:none}
.item.tcell{width:100%;text-align:left;font:inherit;color:var(--ink)}
.item.tcell.cur{border-color:var(--accent);background:var(--accent-soft)}
.item.tcell.cur .t{color:var(--ink)}
.item.tcell svg{margin-left:auto;color:var(--accent);flex:none}

/* ドロワー・シート・トースト */
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.5);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(82%,320px);z-index:61;background:var(--surface);border-left:1px solid var(--line);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);transform:translateX(100%);visibility:hidden;transition:transform .28s ease,visibility 0s .28s;display:flex;flex-direction:column}
.drawer.open{transform:none;visibility:visible;transition:transform .28s ease,visibility 0s 0s}
.drawer .dh{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);font-family:var(--font-display);font-weight:700;font-size:17px}
.drawer nav{display:flex;flex-direction:column}
.drawer nav button{display:flex;align-items:center;gap:14px;padding:16px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font-size:16px}
.drawer nav button svg:first-child{color:var(--accent)}
.drawer nav button .chev{margin-left:auto;color:var(--muted)}
.nd{display:none;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-left:-4px}
#menunav.has-news .nd{display:block}
.nd+.chev{margin-left:auto}
.menubtn.dot::after{content:'';position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid #fff;box-sizing:content-box}
.item.news{align-items:flex-start}
.nbody{overflow-wrap:anywhere;margin:8px 0 6px;line-height:1.8}
.nbody img{display:block;max-width:100%;height:auto;border-radius:12px;margin:8px 0}
.nex{color:var(--muted);font-size:14px;margin:2px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item.news{width:100%;text-align:left;font:inherit;color:var(--ink)}
.newsd h2{font-size:22px;overflow-wrap:anywhere}
.rte-tb{display:flex;flex-wrap:wrap;gap:6px}
.rte-tb button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px;color:var(--ink)}
.rte-tb .cdot::before{content:'';width:20px;height:20px;border-radius:50%;background:var(--c)}
.rte{min-height:260px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);outline:none;margin:0}
.rte:focus{border-color:var(--accent)}
.rte:empty::before{content:attr(data-ph);color:var(--muted)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;margin:0 auto;max-width:560px;max-height:88%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:18px}
.scrim.s{z-index:70}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;max-width:calc(100% - 32px);padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:700;box-shadow:var(--shadow)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.sw input{width:22px;height:22px;accent-color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:10px;min-height:44px;font-weight:700}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.cropwrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.cropwrap canvas{width:min(100%,280px);aspect-ratio:1;border-radius:16px;background:var(--line);touch-action:none;cursor:grab}
.cropwrap input[type=range]{width:min(100%,280px);accent-color:var(--accent)}
.cardrow{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 40px;gap:8px;align-items:center}
#rows{counter-reset:rn}
.cardrow::before{counter-increment:rn;content:counter(rn);text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* ---- 白基調の調整と動き ---- */
.modebtn{height:34px;padding:0 10px 0 8px;gap:5px;font-size:12px}
.logo{padding:4px 0}
.logoimg{display:block;height:26px;width:auto;max-width:100%}
.logoimg.big{height:auto;width:min(280px,76vw);margin:0 auto 6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mark{width:26px;height:26px;font-size:15px}
@media (max-width:380px){.logo>span:last-child{display:none}}
main{scroll-behavior:smooth}
.scrim{background:rgba(27,35,54,.35)}
#menuscrim{opacity:0;visibility:hidden;transition:opacity .3s var(--ease),visibility 0s .3s}
#menuscrim.on{opacity:1;visibility:visible;transition:opacity .3s var(--ease),visibility 0s 0s}
.drawer{transition:transform .4s var(--ease),visibility 0s .4s}
.drawer.open{box-shadow:-12px 0 40px rgba(27,35,54,.12);transition:transform .4s var(--ease),visibility 0s 0s}
.drawer.open nav button{animation:rise .5s var(--ease) backwards}
.drawer.open nav button:nth-child(1){animation-delay:.14s}
.drawer.open nav button:nth-child(2){animation-delay:.2s}
.drawer.open nav button:nth-child(3){animation-delay:.26s}
.drawer.open nav button:nth-child(4){animation-delay:.32s}
.drawer.open nav button:nth-child(5){animation-delay:.38s}
.drawer.open nav button:nth-child(6){animation-delay:.44s}
.hdr{animation:fadeIn .5s var(--ease)}
.day{background:var(--soft)}
.cropwrap canvas{background:var(--soft)}
.btn,.iconbtn,.tile,.item,.day,.modebtn,.menubtn,.seg button,.tt{transition:transform .2s var(--ease),background-color .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease),box-shadow .25s var(--ease),opacity .25s var(--ease),filter .25s}
.btn:active,.iconbtn:active,.tile:active,.day:active,.modebtn:active,.menubtn:active{transform:scale(.96)}
@media (hover:hover){.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}.btn:hover:not(:disabled){border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}.btn.primary:hover:not(:disabled){filter:brightness(1.07)}.iconbtn:hover{background:var(--soft)}}
.in-fwd{animation:inFwd .45s var(--ease) backwards}
.in-back{animation:inBack .45s var(--ease) backwards}
.in-fade{animation:inFade .5s var(--ease) backwards}
.tiles>*{animation:rise .55s var(--ease) backwards}
.tiles>*:nth-child(1){animation-delay:.04s}
.tiles>*:nth-child(2){animation-delay:.1s}
.tiles>*:nth-child(3){animation-delay:.16s}
.tiles>*:nth-child(4){animation-delay:.22s}
@keyframes inFwd{from{opacity:0;transform:translateX(28px)}}
@keyframes inBack{from{opacity:0;transform:translateX(-28px)}}
@keyframes inFade{from{opacity:0;transform:translateY(10px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}}
@keyframes sheetOut{to{transform:translateY(40px);opacity:0}}
.scrim.s{animation:fadeIn .3s var(--ease)}
.sheet{animation:sheetIn .42s var(--ease)}
#layer.closing{pointer-events:none}
#layer.closing .scrim.s{animation:fadeOut .24s var(--ease) forwards}
#layer.closing .sheet{animation:sheetOut .24s var(--ease) forwards}
.toast{opacity:0;pointer-events:none;transform:translate(-50%,14px);transition:opacity .3s var(--ease),transform .35s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fc-in{transition:transform .55s var(--ease)}
.bar i{transition:width .4s var(--ease)}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.in.bad,.in.bad:focus{border-color:var(--bad)}
.in.bad:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 16%,transparent)}
.in{transition:border-color .2s var(--ease),box-shadow .25s var(--ease)}
.msg{transition:color .25s}
/* 初期設定 */
.view.onb{min-height:100%;gap:20px}
.prog{display:flex;align-items:center;gap:12px}
.prog .bar{flex:1;height:5px}
.prog .bar i{transition:width .7s var(--ease)}
.stephead h2{font-size:clamp(26px,7.5vw,32px);font-weight:900;line-height:1.25;margin-bottom:6px}
.field.big{gap:8px}

/* ようこそ画面 */
.welcome{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:rgba(255,255,255,0);-webkit-backdrop-filter:blur(0px);backdrop-filter:blur(0px);transition:background .8s var(--ease),backdrop-filter .9s var(--ease),-webkit-backdrop-filter .9s var(--ease)}
.welcome.in{background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.welcome>*{opacity:0;transform:translateY(16px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.welcome .avatar{width:104px;height:104px;max-height:none;font-size:44px}

.welcome.leave>*,.welcome.leave .w-av,.welcome.leave .w-name,.welcome.leave .w-line,.welcome.leave .w-btn{opacity:0;transform:scale(.97) translateY(-6px);transition:opacity .45s var(--ease),transform .45s var(--ease);transition-delay:0s}
/* 数字が下から上がってくる時計 */
.roll{display:flex;justify-content:center;align-items:flex-start;line-height:1.12;font-family:var(--font-display);font-weight:400;color:var(--ink);user-select:none}

}
function cropGeom(){const B=280,R=B/2-12;const base=Math.max(B/C.img.width,B/C.img.height);const s=base*C.z,w=C.img.width*s,h=C.img.height*s;const mx=Math.max(0,(w-2*R)/2),my=Math.max(0,(h-2*R)/2);C.ox=clamp(C.ox,-mx,mx);C.oy=clamp(C.oy,-my,my);return{B,R,w,h,px:B/2-w/2+C.ox,py:B/2-h/2+C.oy}}

  cv.style.cursor=C?'grab':'pointer';
  if(!C){const cs=getComputedStyle(document.body);const mu=cs.getPropertyValue('--muted').trim()||'#6B7488',ac=cs.getPropertyValue('--accent').trim()||'#2250D8';x.fillStyle='rgba(34,80,216,.05)';x.beginPath();x.arc(140,140,128,0,Math.PI*2);x.fill();x.strokeStyle=ac;x.lineWidth=2;x.setLineDash([7,7]);x.beginPath();x.arc(140,140,128,0,Math.PI*2);x.stroke();x.setLineDash([]);x.lineWidth=3;x.lineCap='round';x.beginPath();x.moveTo(140,112);x.lineTo(140,150);x.moveTo(121,131);x.lineTo(159,131);x.stroke();x.fillStyle=mu;x.font='500 14px "Higure Gothic","Zen Kaku Gothic New",sans-serif';x.textAlign='center';x.fillText('タップして写真を選ぶ',140,184);return}
  const g=cropGeom();x.drawImage(C.img,g.px,g.py,g.w,g.h);x.fillStyle='rgba(10,15,30,.55)';x.beginPath();x.rect(0,0,280,280);x.arc(140,140,g.R,0,Math.PI*2,true);x.fill('evenodd');x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.arc(140,140,g.R,0,Math.PI*2);x.stroke()}

async function pdfWords(file,prog){if(!window.pdfjsLib)throw new Error('lib');

  for(let p=1;p<=doc.numPages;p++){if(prog)prog(p,doc.numPages);const pg=await doc.getPage(p);const tc=await pg.getTextContent();const rows=[];
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=it.transform[5];let r=rows.find(r=>Math.abs(r.y-y)<2.5);if(!r){r={y,a:[]};rows.push(r)}r.a.push({x:it.transform[4],w:it.width||0,s:it.str})});
    rows.sort((a,b)=>b.y-a.y).forEach(r=>{r.a.sort((a,b)=>a.x-b.x);const a=r.a.slice();if(a.length&&/^\s*\d+\s*$/.test(a[0].s))a.shift();
      let t='',d='';

let ST=null,SW=null,swBlock=0;

function pdfMsg(s){const i=$('#pdfInner');if(i)i.innerHTML='<p class="muted" style="padding:24px">'+s+'</p>'}
async function pdfStart(){const box=$('#pdfBox');if(PDF.io)PDF.io.disconnect();PDF.doc=null;PDF.pinch=null;
  if(!window.pdfjsLib){pdfMsg('PDFビューアを読み込めませんでした。ネットワークを確認して、もう一度開いてください。');return}
  try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const f0=sc().files.find(x=>x.id===view.fid);const b=f0?await fileBlob(f0,key()):null;if(!b){pdfMsg('ファイルを取得できませんでした。ネットワークを確認してください。');return}
    const buf=await b.arrayBuffer();const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
    const sizes=await Promise.all(Array.from({length:doc.numPages},async(_,i)=>{const pg=await doc.getPage(i+1);const v=pg.getViewport({scale:1});return{w:v.width,h:v.height}}));

function pdfBuild(){const inn=$('#pdfInner');if(!inn||!PDF.doc)return;if(PDF.io)PDF.io.disconnect();inn.innerHTML='';
  const single=pdfMode()==='single';const idx=single?[PDF.page-1]:[...Array(PDF.doc.numPages).keys()];
  idx.forEach(i=>{const d=document.createElement('div');d.className='pgw';d.dataset.p=i+1;inn.appendChild(d)});

  else{PDF.io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)pdfPaint(e.target);else pdfDrop(e.target)}),{root:$('#pdfBox'),rootMargin:'900px 0px'});$$('.pgw',inn).forEach(el=>PDF.io.observe(el))}

async function pdfPaint(el){el._on=true;const box=$('#pdfBox');const k=PDF.zoom+':'+box.clientWidth;if(el._k===k)return;el._k=k;if(el._task)el._task.cancel();
  try{const pg=await PDF.doc.getPage(+el.dataset.p);const v1=pg.getViewport({scale:1});const cssW=parseFloat(el.style.width);let sc=cssW/v1.width*Math.min(window.devicePixelRatio||1,2);
    const px=v1.width*sc*v1.height*sc;if(px>12e6)sc*=Math.sqrt(12e6/px);

function pdfGoto(n){const el=$('#pdfInner .pgw[data-p="'+n+'"]');if(el)$('#pdfBox').scrollTo(0,Math.max(0,el.offsetTop-8))}
function pdfMove(d){if(!PDF.doc)return;const n=clamp(PDF.page+d,1,PDF.doc.numPages);if(n===PDF.page)return;PDF.page=n;

  box.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();const r=box.getBoundingClientRect();pdfZoomTo(PDF.zoom*Math.exp(-e.deltaY*.01),e.clientX-r.left,e.clientY-r.top)},{passive:false});

    if(e.touches.length===2){const a=e.touches[0],b=e.touches[1],r=box.getBoundingClientRect(),ir=inn.getBoundingClientRect();const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;
      PDF.pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1,z:PDF.zoom,cx:cx-r.left,cy:cy-r.top,r:1};inn.style.transformOrigin=(cx-ir.left)+'px '+(cy-ir.top)+'px';inn.style.willChange='transform';sx=NaN}

function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}
async function imgToJpeg(file){const im=await loadImg(file);let w=im.naturalWidth,h=im.naturalHeight;if(!w||!h)throw new Error('size');
  const k=Math.min(1,2400/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.9));if(!blob)throw new Error('jpeg');
  return{bytes:new Uint8Array(await blob.arrayBuffer()),w,h}}
function buildPdf(pages){const enc=new TextEncoder();const parts=[];let len=0;const offs=[];
  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);len+=u.length};
  const obj=(id,fn)=>{offs[id]=len;push(id+' 0 obj\n');fn();push('\nendobj\n')};
  const n=pages.length;push('%PDF-1.4\n%âãÏÓ\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push('<< /Type /Pages /Count '+n+' /Kids ['+pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] >>'));
  pages.forEach((p,i)=>{const W=595,H=Math.round(W*p.h/p.w*100)/100;const pid=3+3*i,cid=4+3*i,iid=5+3*i;const cs='q '+W+' 0 0 '+H+' 0 0 cm /Im0 Do Q';
    obj(pid,()=>push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im0 '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>'));
    obj(cid,()=>push('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream'));
    obj(iid,()=>{push('<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.bytes.length+' >>\nstream\n');push(p.bytes);push('\nendstream')})});
  const xr=len,total=3+3*n;push('xref\n0 '+total+'\n0000000000 65535 f \n');
  for(let id=1;id<total;id++)push(String(offs[id]).padStart(10,'0')+' 00000 n \n');
  push('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'})}
const isPdf=f=>/\.pdf$/i.test(f.name)||f.type==='application/pdf';

/* 安全なリッチテキスト(許可した太字・斜体・下線・色・画像だけを残す) */
const SZ={1:'x-small',2:'small',3:'medium',4:'large',5:'x-large',6:'xx-large',7:'xxx-large'};
function cleanHTML(h){const doc=new DOMParser().parseFromString('<body>'+(h||''),'text/html');
  const OK=/^(div|p|br|b|strong|i|em|u|span|font|img)$/;const colorOK=c=>/^(#[0-9a-f]{3,8}|rgb\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*\))$/i.test(String(c).trim());
  const walk=(src,dst)=>{src.childNodes.forEach(n=>{
    if(n.nodeType===3){dst.appendChild(document.createTextNode(n.nodeValue));return}
    if(n.nodeType!==1)return;const tag=n.tagName.toLowerCase();
    if(tag==='img'){const src=n.getAttribute('src')||'';const pre=(CFG.url||'')+'/storage/v1/object/public/news/';if(CFG.url&&src.indexOf(pre)===0&&!/["'<>\s]/.test(src)){const im=document.createElement('img');im.setAttribute('src',src);im.setAttribute('alt','');im.setAttribute('loading','lazy');dst.appendChild(im)}return}
    if(tag==='script'||tag==='style')return;
    if(!OK.test(tag)){walk(n,dst);return}
    if(tag==='br'){dst.appendChild(document.createElement('br'));return}
    const el=document.createElement(tag==='strong'?'b':tag==='em'?'i':tag==='font'?'span':tag);const st=[];const s=n.style;
    if(tag==='font'&&n.getAttribute('color')&&colorOK(n.getAttribute('color')))st.push('color:'+n.getAttribute('color'));
    if(tag==='font'&&SZ[n.getAttribute('size')])st.push('font-size:'+SZ[n.getAttribute('size')]);
    if(s){if(s.color&&colorOK(s.color))st.push('color:'+s.color);if(Object.values(SZ).includes(s.fontSize))st.push('font-size:'+s.fontSize);if(/^(bold|[6-9]00)$/.test(s.fontWeight))st.push('font-weight:700');if(s.fontStyle==='italic')st.push('font-style:italic');if(/underline/.test(s.textDecorationLine||s.textDecoration||''))st.push('text-decoration:underline')}
    if(st.length)el.setAttribute('style',st.join(';'));walk(n,el);dst.appendChild(el)})};
  const out=document.createElement('div');walk(doc.body,out);return out.innerHTML}

async function flushOutbox(){if(flushing||!SB||AUTH!=='in'||!S.outbox.length||!online())return;flushing=true;
  try{while(S.outbox.length){const e=S.outbox[0];const r=await SB.from('study_logs').insert({d:e.d,sec:e.sec,src:e.src});
    if(r.error){if(/row-level|policy|violat|check/i.test(r.error.message||''))S.outbox.shift();else break}else S.outbox.shift();save()}}catch(e){}flushing=false}

async function loadLogs(){let all=[];for(let p=0;p<10;p++){const r=await SB.from('study_logs').select('d,sec,src').order('d',{ascending:false}).range(p*1000,p*1000+999);if(r.error)throw r.error;all=all.concat(r.data);if(r.data.length<1000)break}
  S.log=all.reverse().map(x=>({d:x.d,sec:x.sec,src:x.src})).concat(S.outbox.map(e=>({d:e.d,sec:e.sec,src:e.src})));save()}
async function loadGroups(){if(!SB||!ME)return;
  const gr=await SB.from('groups').select('id,code,name,owner,created_at');if(gr.error)throw gr.error;const rows=gr.data||[];
  if(!rows.length){S.groups={};S.myGroups=[];S.myGroup=null;save();return}
  const ids=rows.map(g=>g.id);
  const [m,st,sj,fl,ev]=await Promise.all([
    SB.from('group_members').select('group_id,user_id,joined_at').in('group_id',ids),
    SB.from('group_sets').select('id,group_id,by,name,cards,created_at').in('group_id',ids).order('created_at'),
    SB.from('subjects').select('id,group_id,by,cat,name,created_at').in('group_id',ids).order('created_at'),
    SB.from('files').select('id,group_id,subject_id,by,name,size,path,created_at').in('group_id',ids).order('created_at'),
    SB.from('events').select('id,group_id,by,title,date,time,notify').in('group_id',ids).order('date')]);
  for(const r of [m,st,sj,fl,ev])if(r.error)throw r.error;
  const uids=[...new Set(m.data.map(x=>x.user_id))];
  const pr=await SB.from('profiles').select('id,uid,nick,birth,icon,title_id,title_front,title_back,total_sec,ach').in('id',uids);if(pr.error)throw pr.error;
  const byId={};pr.data.forEach(p=>byId[p.id]=p);const H=id=>byId[id]?byId[id].uid:'?';
  const next={},cat={};sj.data.forEach(s=>cat[s.id]=s.cat);
  rows.forEach(g=>{const mem=m.data.filter(x=>x.group_id===g.id).sort((a,b)=>String(a.joined_at).localeCompare(String(b.joined_at))).map(x=>x.user_id);
    const o=next[g.code]={id:g.id,name:g.name,created:Date.parse(g.created_at)||0,owner:H(g.owner),members:mem.map(H),profiles:{}};
    mem.forEach(id=>{const p=byId[id];if(p)o.profiles[p.uid]={nick:p.nick,icon:p.icon,title:joinTitle(p.title_front||p.title_id,p.title_back||p.title_id),birth:String(p.birth||'').slice(5),sec:+p.total_sec||0,ach:Object.keys(p.ach||{})}});
    const sp=scope(g.code);
    sp.sets=st.data.filter(x=>x.group_id===g.id).map(x=>({id:x.id,by:H(x.by),name:x.name,cards:(x.cards||[]).map((c,i)=>({id:x.id+':'+i,t:c.t,d:c.d}))}));
    sp.subs=sj.data.filter(x=>x.group_id===g.id).map(x=>({id:x.id,by:H(x.by),cat:x.cat,name:x.name}));
    sp.files=fl.data.filter(x=>x.group_id===g.id).map(x=>({id:x.id,by:H(x.by),cat:cat[x.subject_id]||'text',sub:x.subject_id,name:x.name,size:+x.size||0,path:x.path,added:String(x.created_at).slice(0,10)}));
    sp.cal=ev.data.filter(x=>x.group_id===g.id).map(x=>({id:x.id,by:H(x.by),title:x.title,date:x.date,time:x.time||'',notify:x.notify||'none'}))});
  const codes=rows.map(g=>g.code);S.groups=next;S.myGroups=S.myGroups.filter(c=>codes.includes(c)).concat(codes.filter(c=>!S.myGroups.includes(c)));
  Object.keys(S.scopes).forEach(k=>{if(k!=='private'&&!next[k])delete S.scopes[k]});
  if(!S.myGroups.includes(S.myGroup))S.myGroup=S.myGroups[0]||null;S.stats.groups=Math.max(S.stats.groups,rows.length);save()}

async function fileBlob(f,k){let b=await getBlob(f.id);if(b)return b;if(k!=='private'&&SB&&f.path){b=await STORE.get(f.path);if(b){await putBlob(f.id,b);return b}}return null}
async function capOk(size){const cap=(+CFG.capMB||100)*1048576;let cur=0;try{const r=await SB.from('files').select('size').eq('by',ME.id);if(!r.error)cur=r.data.reduce((a,x)=>a+(+x.size||0),0)}catch(e){}
  if(cur+size>cap){toast('保存できる容量の上限です');return false}return true}
async function upFile(blob,name,subId){const g=gcur();const id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():uuid4();const path=g.id+'/'+id+'.pdf';
  const up=await STORE.put(path,blob);if(up.error){toast(errMsg(up.error));return null}
  const r=await SB.from('files').insert({id,group_id:g.id,subject_id:subId,by:ME.id,name,size:blob.size,path});
  if(r.error){await STORE.del([path]);toast(errMsg(r.error));return null}
  await putBlob(id,blob);S.stats.uploads++;return id}

async function enter(user){
  ME=user;loadState(user.id);initDefs();
  try{localStorage.setItem('manabi.last',JSON.stringify({id:user.id,email:user.email||''}))}catch(e){}
  const email=(user.email||'').toLowerCase();let prof=null,pp=null,err=false;
  try{const r1=await SB.from('profiles').select('*').eq('id',user.id).maybeSingle();if(r1.error)throw r1.error;prof=r1.data;
    const r2=await SB.from('profile_private').select('terms_v,opt_news').eq('id',user.id).maybeSingle();if(r2.error)throw r2.error;pp=r2.data}catch(e){err=true}
  if(err){if(S.user&&S.user.done&&S.user.id===user.id){OFFL=true}else{AUTH='neterr';render();return}}
  else if(prof){
    if(prof.banned){AUTH='banned';render();return}
    S.user={id:user.id,email,nick:prof.nick,uid:prof.uid,birth:prof.birth||'',icon:prof.icon||'',tf:prof.title_front||prof.title_id||'t0',tb:prof.title_back||prof.title_id||'t0',done:true,termsV:pp&&pp.terms_v||null,step:0};
    Object.keys(prof.stats||{}).forEach(k=>{S.stats[k]=Math.max(+S.stats[k]||0,+prof.stats[k]||0)});S.ach=Object.assign({},prof.ach||{},S.ach);lastSync=JSON.stringify([S.stats,S.ach]);const mm=gm();mm.coins=prof.coins||0;mm.pets=prof.pets||{};mm.own=prof.own_titles||[];mm.main=prof.pet_main||'';mm.days=prof.login_days||0}
  else{if(!S.user||S.user.done||S.user.id!==user.id)S.user={id:user.id,email,step:0,nick:'',uid:'',birth:'',icon:'',tf:'t0',tb:'t0',done:false};S.user.termsV=pp&&pp.terms_v||null}
  AUTH='in';render();
  if(err)return;
  if(S.user.done){if(S.timer&&S.timer.run&&S.user.termsV===TERMS_V)setTimeout(openFocus,150);bgLoad()}}
function resetAuth(){save();UID0=null;ME=null;S=defaults();stack.length=0;AUTH='out';view={name:'login'};lastKey='';closeMenu();render()}
async function boot(){
  if(!window.supabase||!CFG.url||!CFG.key){AUTH='out';render();return}
  if(!SB){SB=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
    SB.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&AUTH==='in')resetAuth()})}
  let ses=null;try{ses=(await SB.auth.getSession()).data.session}catch(e){}
  try{if(/[?&]code=|access_token=/.test(location.search+location.hash))history.replaceState(null,'',location.pathname)}catch(e){}
  if(ses){await enter(ses.user);return}
  if(!online()){let l=null;try{l=JSON.parse(localStorage.getItem('manabi.last')||'null')}catch(e){}
    if(l&&l.id){OFFL=true;await enter({id:l.id,email:l.email});return}}
  AUTH='out';render()}

function rollMarkup(s){const hm=s.split(':').map(Number);const h=hm[0],m=hm[1];let k=0;return [...s].map(ch=>{const i=k++;const d=i<=2?h===0:(i<=5?(h===0&&m===0):false);const cls=(ch===':'?'rs':'rc'+(i>=6?' sec':''))+(d?' dim':'');return ch===':'?`<span class="${cls}">:</span>`:`<span class="${cls}"><span class="rv">${ch}</span></span>`}).join('')}
function rollDim(root,s){const hm=s.split(':').map(Number);const h=hm[0],m=hm[1];[...root.children].forEach((el,i)=>{el.classList.toggle('dim',i<=2?h===0:(i<=5?(h===0&&m===0):false))})}
function rollSet(root,s){if(!root||root.dataset.v===s)return;
  const cells=root.querySelectorAll('.rc'),nd=s.replace(/:/g,''),od=(root.dataset.v||'').replace(/:/g,'');
  if(!root.dataset.v||cells.length!==nd.length){root.innerHTML=rollMarkup(s);root.dataset.v=s;root.setAttribute('aria-label',s);return}
  const ease='cubic-bezier(.22,.8,.24,1)';
  cells.forEach((c,i)=>{if(od[i]===nd[i])return;
    c.querySelectorAll('.rv.out').forEach(x=>x.remove());
    const cur=c.lastElementChild;
    if(!cur||reduceMotion()||!c.animate){c.innerHTML='<span class="rv">'+nd[i]+'</span>';return}
    cur.classList.add('out');
    const nx=document.createElement('span');nx.className='rv';nx.textContent=nd[i];c.appendChild(nx);
    cur.animate([{transform:'translateY(0)',opacity:1,filter:'blur(0px)'},{transform:'translateY(-100%)',opacity:0,filter:'blur(3px)'}],{duration:560,easing:ease,fill:'forwards'}).onfinish=()=>cur.remove();
    nx.animate([{transform:'translateY(100%)',opacity:0,filter:'blur(3px)'},{transform:'translateY(0)',opacity:1,filter:'blur(0px)'}],{duration:560,easing:ease})});
  root.dataset.v=s;root.setAttribute('aria-label',s);rollDim(root,s)}
const PAUSE_SVG='<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.6"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6"/></svg>';
const PLAY_SVG='<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.2-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6z"/></svg>';
let fxNow=false;try{fxNow=localStorage.getItem('manabi.fxNow')==='1'}catch(e){}
function fxLabel(){const l=$('#fxMode');if(l)l.textContent=(fxNow?'現在時刻':'計測時間')+'　タップで切りかえ'}
function fxTick(){const c=$('#fxClock');if(!c)return;if(fxNow){const d=new Date();rollSet(c,z2(d.getHours())+':'+z2(d.getMinutes())+':'+z2(d.getSeconds()))}else rollSet(c,clock(timerSec()))}
A.fxMode=()=>{fxNow=!fxNow;try{localStorage.setItem('manabi.fxNow',fxNow?'1':'0')}catch(e){}fxLabel();fxTick()};
const BG_COLORS=['#9DB2FF','#B9A5FF','#D79BFF','#FF9FCF','#FFA3A3','#FFB38A','#FFD27A','#EBDD6B','#B9E37A','#86E3C8','#79D0FF','#8FC2FF'];
let fxTimers=[];
const rnd=(a,b)=>a+Math.random()*(b-a);
const fxIn=()=>`translate(${rnd(-12,58).toFixed(1)}vw,${rnd(-8,58).toFixed(1)}vh) scale(${rnd(.85,1.3).toFixed(2)})`;
function fxOut(){const s=Math.floor(Math.random()*4),x=rnd(-10,60).toFixed(1),y=rnd(-8,58).toFixed(1);return['translate(-125vw,'+y+'vh)','translate(125vw,'+y+'vh)','translate('+x+'vw,-125vh)','translate('+x+'vw,125vh)'][s]+' scale(1)'}
function fxPick(b){const used=[...document.querySelectorAll('#focus .fx-blob')].filter(x=>x!==b).map(x=>x.dataset.c);const pool=BG_COLORS.filter(c=>!used.includes(c));return pool[Math.floor(Math.random()*pool.length)]}
function fxMove(b,tf,d){b.style.transition=d?`transform ${Math.round(d)}ms cubic-bezier(.45,.05,.55,.95)`:'none';b.style.transform=tf}
function fxBgStart(){const bl=[...document.querySelectorAll('#focus .fx-blob')];if(!bl.length||fxTimers.length)return;
  bl.forEach((b,i)=>{if(!b.dataset.init){b.dataset.init='1';const c=fxPick(b);b.dataset.c=c;b.style.backgroundColor=c;fxMove(b,fxIn(),0)}
    if(reduceMotion())return;
    /* 画面の外へ出る → 外で色を替える → 別の方向から入ってくる(同時に見える色は3つまで) */
    const run=()=>{const d1=rnd(2600,4600);fxMove(b,fxOut(),d1);
      fxTimers[i]=setTimeout(()=>{const c=fxPick(b);b.dataset.c=c;b.style.backgroundColor=c;fxMove(b,fxOut(),0);void b.offsetWidth;const d2=rnd(3800,7000);fxMove(b,fxIn(),d2);
        fxTimers[i]=setTimeout(run,d2+rnd(2500,6000))},d1+80)};
    fxTimers[i]=setTimeout(run,rnd(1500,7000))})}
function fxBgStop(){fxTimers.forEach(x=>clearTimeout(x));fxTimers=[]}
function focusPaint(){const el=$('#focus');if(!el)return;const run=S.timer.run;el.classList.toggle('paused',!run);$('#fxState').innerHTML='<i></i>'+(run?'勉強中':'一時停止中');const pb=$('#fxPause');pb.innerHTML=run?PAUSE_SVG:PLAY_SVG;pb.setAttribute('aria-label',run?'一時停止':'再開');if(run)fxBgStart();else fxBgStop();fxTick()}
function openFocus(){const old=$('#focus');if(old&&!old.classList.contains('leave'))return;if(old)old.remove();
  const el=document.createElement('div');el.id='focus';el.className='focus';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','勉強タイマー');
  el.innerHTML=`<div class="fx-bg" aria-hidden="true"><i class="fx-blob"></i><i class="fx-blob"></i><i class="fx-blob"></i></div><button class="iconbtn fx-close" data-act="focusClose" aria-label="小さくする">${svg('x')}</button><div class="fx-body"><p class="fx-state" id="fxState"></p><div class="fx-clock roll" id="fxClock" role="timer" data-act="fxMode" style="cursor:pointer"></div><p class="fx-mode" id="fxMode"></p></div><div class="fx-ctl"><button class="btn fx-pause" id="fxPause" data-act="focusPause"></button><button class="btn fx-btn" data-act="focusEnd">終了して保存</button></div>`;
  document.body.appendChild(el);petSync();petPeek(el);focusPaint();fxLabel();fxTick();void el.offsetWidth;el.classList.add('in');
  try{const r=document.documentElement;const f=r.requestFullscreen||r.webkitRequestFullscreen;if(f){const pr=f.call(r);if(pr&&pr.catch)pr.catch(()=>{})}}catch(e){}
  wlGet()}
function closeFocus(){const el=$('#focus');if(!el)return;el.classList.add('leave');wlRelease();fxBgStop();
  try{if(document.fullscreenElement){document.exitFullscreen().catch(()=>{})}else if(document.webkitFullscreenElement&&document.webkitExitFullscreen){document.webkitExitFullscreen()}}catch(e){}
  setTimeout(()=>{if(el.parentNode)el.remove();petSync()},520)}
/* ---------- コイン・ガチャ・ペット ---------- */
let PETS=[],RANKS=[],gBusy=false;
try{const c=JSON.parse(localStorage.getItem('manabi.gacha')||'null');if(c){PETS=c.p||[];RANKS=c.r||[]}}catch(e){}
function gm(){return S.me||(S.me={coins:0,pets:{},own:[],main:'',days:0})}
const RCOL=['#8A93A6','#2250D8','#8B3FD9','#E0A100','#D8387A','#17894F'];
const rcol=id=>RCOL[Math.max(0,RANKS.findIndex(r=>r.id===id))%RCOL.length];
const petUrl=f=>String(CFG.url||'').replace(/\/$/,'')+'/storage/v1/object/public/pets/'+encodeURIComponent(f);
const petById=id=>PETS.find(p=>p.id===id);
const pimg=(p,nm)=>p&&p.img?`<img src="${esc(petUrl(p.img))}" alt="" draggable="false">`:`<span class="pfb" style="background:${rcol(p?p.rank:'')}">${esc((nm||(p&&p.name)||'?').slice(0,1))}</span>`;
const gcost=n=>+((CFG.set||{})[n===1?'gacha_cost1':'gacha_cost10'])||(n===1?3:30);
function rates(){const has=r=>PETS.some(p=>p.rank===r.id)||TITLES.some(t=>t.g===r.id);const L=RANKS.filter(r=>+r.rate>0&&has(r));const tot=L.reduce((a,r)=>a+(+r.rate),0)||1;return RANKS.map(r=>({id:r.id,name:r.name,pct:L.includes(r)?(+r.rate)/tot*100:0}))}
async function loadGacha(){try{const [r,p]=await Promise.all([SB.from('gacha_ranks').select('*').order('sort'),SB.from('pets').select('*').eq('active',true).order('sort')]);if(r.error||p.error)return;RANKS=r.data;PETS=p.data;try{localStorage.setItem('manabi.gacha',JSON.stringify({r:RANKS,p:PETS}))}catch(e){}petSync()}catch(e){}}
async function loadMe(){try{const r=await SB.from('profiles').select('coins,pets,own_titles,pet_main,login_days').eq('id',ME.id).maybeSingle();if(r.error||!r.data)return;const m=gm();m.coins=r.data.coins||0;m.pets=r.data.pets||{};m.own=r.data.own_titles||[];m.main=r.data.pet_main||'';m.days=r.data.login_days||0;save();petSync()}catch(e){}}
async function loginBonus(){try{const r=await SB.rpc('claim_login');if(r.error||!r.data||!r.data.claimed)return;const m=gm();m.coins=r.data.coins;m.days=r.data.day;save();
  const html=`<div style="text-align:center;padding:8px 0 4px"><div style="color:var(--muted)">ログインボーナス ${r.data.day}日目</div><div class="coinbar" style="margin:14px 0"><span class="cn">${svg('coin',26)}</span><b>+${r.data.gain}</b></div><button class="btn primary block" data-act="closeSheet">受け取る</button></div>`;
  if(document.querySelector('#layer .sheet')||$('#focus'))toast('ログインボーナス +'+r.data.gain+'コイン');else sheet(html);softRender()}catch(e){}}
function petSync(){let L=$('#petlayer');const p=petById(gm().main);const show=AUTH==='in'&&S.user&&S.user.done&&p&&(view.name==='home'||view.name==='time')&&!$('#focus');
  if(!show){if(L)L.remove();return}
  const sig=p.id+'|'+p.img;if(L&&L.dataset.sig===sig)return;if(L)L.remove();
  L=document.createElement('div');L.id='petlayer';L.className='petlayer';L.dataset.sig=sig;L.setAttribute('aria-hidden','true');L.innerHTML=`<div class="pet-w"><div class="pet-i">${pimg(p)}</div></div>`;document.body.appendChild(L);petWalk(L)}
function petWalk(L){const w=L.querySelector('.pet-w');if(!w)return;
  if(reduceMotion()){w.style.top=(innerHeight*.6)+'px';w.style.transform='translateX('+(innerWidth*.5)+'px)';return}
  const go=()=>{if(!L.isConnected)return;const W=innerWidth,H=innerHeight,dir=Math.random()<.5?1:-1,y=Math.random()*Math.max(10,H-130)+20,x0=dir>0?-70:W+10,x1=dir>0?W+10:-70,dur=(W+80)/(26+Math.random()*24)*1000;
    w.style.top=y+'px';const a=w.animate([{transform:`translateX(${x0}px) scaleX(${dir})`},{transform:`translateX(${x1}px) scaleX(${dir})`}],{duration:dur,easing:'linear',fill:'forwards'});a.onfinish=()=>setTimeout(go,900+Math.random()*3500)};go()}
function petPeek(el){const p=petById(gm().main);if(!p)return;const d=document.createElement('div');d.className='pet-peek';d.innerHTML=pimg(p);const place=()=>{d.style.left=(8+Math.random()*Math.max(10,innerWidth-100))+'px'};place();d.addEventListener('animationiteration',place);el.appendChild(d)}
V.gacha=()=>{const m=gm(),tab=view.tab==='zukan'||view.tab==='own'?view.tab:'pull',rt=rates();
  const pc=p=>`<button class="zc ${m.main===p.id?'cur':''}" style="--rc:${rcol(p.rank)}" data-act="petSet" data-id="${esc(p.id)}" aria-pressed="${m.main===p.id}"><span class="pi">${pimg(p)}</span><span class="zn">${esc(p.name)}</span>${m.pets[p.id]>1?`<span class="zx">×${m.pets[p.id]}</span>`:''}${m.main===p.id?`<span class="zm">${svg('check',16)}</span>`:''}</button>`;
  const tabs=`<div class="chips"><button class="chip ${tab==='pull'?'on':''}" data-act="gTab" data-tab="pull" aria-pressed="${tab==='pull'}"><span>ガチャ</span></button><button class="chip ${tab==='own'?'on':''}" data-act="gTab" data-tab="own" aria-pressed="${tab==='own'}"><span>持ち物</span></button><button class="chip ${tab==='zukan'?'on':''}" data-act="gTab" data-tab="zukan" aria-pressed="${tab==='zukan'}"><span>図鑑</span></button></div>`;
  if(tab==='pull'){const c1=gcost(1),c10=gcost(10);
    return`<div class="view">${sub('ガチャ')}${tabs}<div class="coinbar"><span class="cn">${svg('coin',26)}</span><b>${m.coins}</b></div>
    <div class="gbtns"><button class="btn primary gb ${m.coins<c1?'low':''}" data-act="gachaPull" data-n="1">1連<small>${c1}コイン</small></button><button class="btn primary gb ${m.coins<c10?'low':''}" data-act="gachaPull" data-n="10">10連<small>${c10}コイン</small></button></div>
    <div class="rkrow">${rt.filter(r=>r.pct>0).map(r=>`<span class="rk" style="--rc:${rcol(r.id)}"><b>${esc(r.id)}</b>${Math.round(r.pct*10)/10}%</span>`).join('')}</div></div>`}
  if(tab==='own'){const op=PETS.filter(p=>m.pets[p.id]),ot=TITLES.filter(t=>t.g&&m.own.includes(t.id));
    return`<div class="view">${sub('ガチャ')}${tabs}<section class="zk" style="--rc:var(--accent)"><div class="zk-h"><b>ペット</b><span class="grow"></span><span class="muted">${op.length}/${PETS.length}</span></div>${op.length?`<div class="zgrid">${op.map(pc).join('')}</div>`:'<div class="empty">まだいません</div>'}</section>
    <section class="zk" style="--rc:var(--accent)"><div class="zk-h"><b>肩書</b><span class="grow"></span><span class="muted">${ot.length}/${TITLES.filter(t=>t.g).length}</span></div>${ot.length?`<div class="zgrid">${ot.map(t=>`<div class="zc tz" style="--rc:${rcol(t.g)}"><span>${esc(t.n)}</span><span class="zx">${esc(t.g)}</span></div>`).join('')}</div>`:'<div class="empty">まだありません</div>'}</section></div>`}
  const secs=rt.map(r=>{const ps=PETS.filter(p=>p.rank===r.id),ts=TITLES.filter(t=>t.g===r.id),n=ps.length+ts.length;if(!n)return'';
    const got=ps.filter(p=>m.pets[p.id]).length+ts.filter(t=>m.own.includes(t.id)).length;
    const cells=ps.map(p=>m.pets[p.id]?pc(p):`<div class="zc lock" aria-hidden="true">?</div>`).join('')
      +ts.map(t=>m.own.includes(t.id)?`<div class="zc tz"><span>${esc(t.n)}</span></div>`:`<div class="zc lock" aria-hidden="true">?</div>`).join('');
    return`<section class="zk" style="--rc:${rcol(r.id)}"><div class="zk-h"><b>${esc(r.id)}</b><span>${esc(r.name)}</span><span class="grow"></span><span class="muted">${got}/${n}</span></div><div class="zgrid">${cells}</div></section>`}).join('');
  return`<div class="view">${sub('ガチャ')}${tabs}${secs||'<div class="empty">準備中です</div>'}</div>`};
function showGachaRes(items){const old=$('#gres');if(old){(old._tm||[]).forEach(clearTimeout);old.remove()}const el=document.createElement('div');el.id='gres';el.className='gres';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
  const one=items.length===1,n=RANKS.length,ri=id=>RANKS.findIndex(r=>r.id===id),top=id=>ri(id)>=Math.max(1,n-2),top2=id=>n>=3&&ri(id)===n-1;
  const best=Math.max(0,...items.map(it=>ri(it.rank))),tier=reduceMotion()?0:(n>=3&&best>=n-1?2:(best>=1&&best>=n-2?1:0)),bi=items.find(it=>ri(it.rank)===best)||items[0];
  const col=rcol(bi.rank),ps=tier?Array.from({length:tier===2?36:22},()=>{const a=Math.random()*Math.PI*2,d=(tier===2?170:130)+Math.random()*190;return`<i class="gfx-p" style="--dx:${Math.round(Math.cos(a)*d)}px;--dy:${Math.round(Math.sin(a)*d)}px;--c:${tier===2?'hsl('+Math.round(Math.random()*360)+',95%,62%)':col}"></i>`}).join(''):'';
  el.innerHTML=`<div class="gcards ${one?'one':''}">${items.map((it,i)=>`<div class="gc ${top(it.rank)?'top':''} ${top2(it.rank)?'t2':''}" style="--rc:${rcol(it.rank)};animation-delay:${i*110}ms"><div class="gc-i">${it.kind==='pet'?pimg({img:it.img,rank:it.rank,name:it.name},it.name):`<span class="gc-t">${esc(it.name)}</span>`}</div>${it.kind==='pet'?`<div class="gc-n">${esc(it.name)}</div>`:''}<div class="gc-r">${esc(it.rank)}</div>${it.new?'<i class="gc-new">NEW</i>':''}</div>`).join('')}</div>
  <div class="gres-b"><button class="btn" data-act="gresClose">閉じる</button><button class="btn primary" data-act="gachaPull" data-n="${items.length}">もう一度</button></div>
  ${tier?`<div class="gfx" data-act="gfxSkip" style="--rc:${col}"><div class="gfx-rays"></div><div class="gfx-orb"></div>${ps}<div class="gfx-rank"><b>${esc(bi.rank)}</b><span>${esc(bi.rank_name||'')}</span></div><div class="gfx-flash"></div></div>`:''}`;
  document.body.appendChild(el);void el.offsetWidth;el.classList.add('in');
  if(!tier){el.classList.add('play');return}
  el.classList.add('intro','t'+tier);el._tm=[];
  const end=()=>{if(el.classList.contains('play'))return;(el._tm||[]).forEach(clearTimeout);el.classList.add('out','play');el.classList.remove('intro');setTimeout(()=>{const g=el.querySelector('.gfx');if(g)g.remove();el.classList.remove('out')},480)};
  el._end=end;
  el._tm.push(setTimeout(()=>{el.classList.add('burst');try{navigator.vibrate&&navigator.vibrate(tier===2?[80,40,140]:[70])}catch(e){}},tier===2?2200:1300));
  el._tm.push(setTimeout(end,tier===2?3600:2500))}
A.gfxSkip=()=>{const el=$('#gres');if(el&&el._end)el._end()};
A.gresClose=()=>{const el=$('#gres');if(!el)return;(el._tm||[]).forEach(clearTimeout);el.classList.remove('in');setTimeout(()=>el.remove(),300)};
async function calShareTo(id,code){const e=sc().cal.find(x=>x.id===id),g=S.groups[code];if(!e||!g)return;
  const ok=await gdo(()=>SB.from('events').insert({group_id:g.id,by:ME.id,title:e.title,date:e.date,time:e.time||'',notify:e.notify||'none'}));if(ok){closeSheet();toast(g.name+'に共有しました')}}
A.calShare=t=>{const id=t.dataset.id;if(S.myGroups.length===1){calShareTo(id,S.myGroups[0]);return}
  sheet(`<h3>共有するグループ</h3><div class="list">${S.myGroups.map(c=>`<button class="item tcell" data-act="calShareTo" data-id="${esc(id)}" data-code="${esc(c)}"><span class="t">${esc(S.groups[c].name)}</span></button>`).join('')}</div>`)};
A.calShareTo=t=>calShareTo(t.dataset.id,t.dataset.code);
A.goPets=()=>go('gacha',{tab:'own'});
A.gTab=t=>{view.tab=t.dataset.tab;render()};
A.petSet=t=>{const id=t.dataset.id,m=gm();if(!m.pets[id])return;m.main=id;save();render();petSync();if(SB&&ME)SB.from('profiles').update({pet_main:id}).eq('id',ME.id).then(()=>{})};
A.gachaPull=async t=>{const n=+t.dataset.n===10?10:1,m=gm();if(gBusy)return;if(m.coins<gcost(n)){toast('コインが足りません');return}
  gBusy=true;let r;try{r=await SB.rpc('gacha_pull',{n})}catch(e){r={error:e}}gBusy=false;
  if(r.error){const x=String(r.error.message||'');toast(/not enough/.test(x)?'コインが足りません':/empty/.test(x)?'ガチャは準備中です':errMsg(r.error));loadMe().then(()=>render());return}
  const d=r.data,mm=gm();mm.coins=d.coins;d.items.forEach(it=>{if(it.kind==='pet'){mm.pets[it.id]=(mm.pets[it.id]||0)+1;if(!mm.main)mm.main=it.id}else if(!mm.own.includes(it.id))mm.own.push(it.id)});save();showGachaRes(d.items);render();petSync();loadMe().then(()=>{if(view.name==='gacha')render()})};
A.tmStart=()=>{const t=S.timer;if(!t.run){t.start=Date.now();t.run=true}save();openFocus();render()};
A.focusOpen=()=>openFocus();
A.focusPause=()=>{const t=S.timer;if(t.run){t.acc+=Date.now()-t.start;t.run=false}else{t.start=Date.now();t.run=true}save();focusPaint()};
A.focusClose=()=>{closeFocus();render()};
A.focusEnd=()=>{const sec=Math.round(timerSec());if(sec>=1){addLog(sec,'timer');toast(fmtDur(sec)+'を記録しました')}S.timer={run:false,start:0,acc:0};save();closeFocus();checkAch();render()};

initDefs();render();notifyTick();boot();
if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});


})();
